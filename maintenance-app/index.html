<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Datre Maintenance Desk</title>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#16202b">
<meta name="mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: plant control-room desk. Sticky header + scrollable tab strip, one working pane per tab, bottom sheet for forms. */
:root{
  --bg:#eef1f4; --surface:#ffffff; --sunk:#e3e8ed; --ink:#16202b; --muted:#5b6878; --line:#d3dae2;
  --accent:#c4501a; --accent-ink:#ffffff; --accent-soft:#f7e4d9;
  --ok:#2f7d4f; --ok-soft:#dcefe3; --warn:#9a6512; --warn-soft:#f6ead2; --crit:#b8322a; --crit-soft:#f7dcd9; --info:#2b5f9e; --info-soft:#dde8f5;
  --f-display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f151c; --surface:#18212b; --sunk:#111922; --ink:#e6ebf0; --muted:#93a1b0; --line:#2b3745;
  --accent:#e2783c; --accent-ink:#1a0f08; --accent-soft:#3a2416;
  --ok:#57b981; --ok-soft:#173527; --warn:#dcab4c; --warn-soft:#3a2f17; --crit:#ec6e62; --crit-soft:#3d1c1a; --info:#6aa7e6; --info-soft:#172c42; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f151c; --surface:#18212b; --sunk:#111922; --ink:#e6ebf0; --muted:#93a1b0; --line:#2b3745;
  --accent:#e2783c; --accent-ink:#1a0f08; --accent-soft:#3a2416;
  --ok:#57b981; --ok-soft:#173527; --warn:#dcab4c; --warn-soft:#3a2f17; --crit:#ec6e62; --crit-soft:#3d1c1a; --info:#6aa7e6; --info-soft:#172c42; color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.45 var(--f-body);-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--f-display);font-weight:700;letter-spacing:.01em;margin:0;text-wrap:balance}
h2{font-size:1.55rem}h3{font-size:1.2rem}
.num,.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}.small{font-size:.83rem}
.lbl{font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}

header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--ink);color:var(--bg)}
.top-in{display:flex;align-items:center;gap:12px;padding:10px 16px;flex-wrap:wrap}
.brand{display:flex;flex-direction:column;line-height:1.05;min-width:0}
.brand b{font-family:var(--f-display);font-size:1.45rem;letter-spacing:.02em}
.brand span{font-size:.75rem;opacity:.75}
.top-right{margin-left:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.chip-sync{font-size:.72rem;padding:3px 8px;border-radius:99px;border:1px solid currentColor;opacity:.85;white-space:nowrap}
.me{background:transparent;color:inherit;border:1px solid rgba(255,255,255,.35);border-radius:8px;padding:5px 8px;max-width:170px}
.me option{color:#16202b}
nav.tabs{display:flex;gap:2px;overflow-x:auto;padding:0 10px;scrollbar-width:none;background:var(--ink)}
nav.tabs::-webkit-scrollbar{display:none}
nav.tabs button{background:none;border:0;color:var(--bg);opacity:.7;padding:10px 12px 11px;font-weight:600;font-size:.9rem;white-space:nowrap;cursor:pointer;border-bottom:3px solid transparent;position:relative}
nav.tabs button[aria-selected="true"]{opacity:1;border-bottom-color:var(--accent)}
nav.tabs .cnt{display:inline-block;min-width:18px;padding:0 5px;margin-left:5px;border-radius:9px;background:var(--crit);color:#fff;font-size:.7rem;line-height:18px;text-align:center}

main{max-width:1180px;margin:0 auto;padding:18px 16px 90px}
.pane{display:grid;gap:16px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.spread{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr));gap:16px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;min-width:0}
.panel>h3{margin-bottom:10px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;display:flex;flex-direction:column;gap:2px;cursor:pointer;text-align:left}
.kpi .v{font-family:var(--f-display);font-size:2.1rem;line-height:1}
.kpi.crit .v{color:var(--crit)}.kpi.warn .v{color:var(--warn)}.kpi.ok .v{color:var(--ok)}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:42px;padding:8px 14px;border-radius:9px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-weight:600;text-decoration:none;color:var(--ink)}
.btn:hover{border-color:var(--muted)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.danger{background:var(--crit);border-color:var(--crit);color:#fff}
.btn.ghost{background:transparent}
.btn.sm{min-height:34px;padding:4px 10px;font-size:.85rem}
.btn:focus-visible,button:focus-visible,select:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--info);outline-offset:2px}
.big-actions{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.big-actions .btn{min-height:58px;font-size:1rem}

.pill{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:99px;font-size:.75rem;font-weight:600;white-space:nowrap;background:var(--sunk);color:var(--muted)}
.pill::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.p-ok{background:var(--ok-soft);color:var(--ok)}.p-warn{background:var(--warn-soft);color:var(--warn)}.p-crit{background:var(--crit-soft);color:var(--crit)}.p-info{background:var(--info-soft);color:var(--info)}.p-acc{background:var(--accent-soft);color:var(--accent)}

.list{display:grid;gap:8px}
.item{display:grid;grid-template-columns:5px 1fr auto;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px 10px 0;align-items:center;min-width:0}
.item .stripe{align-self:stretch;border-radius:0 3px 3px 0;background:var(--line)}
.item.s-crit .stripe{background:var(--crit)}.item.s-warn .stripe{background:var(--warn)}.item.s-ok .stripe{background:var(--ok)}.item.s-info .stripe{background:var(--info)}
.item .body{min-width:0}
.item .t{font-weight:600}
.item .d{font-size:.85rem;color:var(--muted);overflow-wrap:anywhere}
.item.acked{opacity:.55}
.empty{padding:22px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:var(--r)}

.mgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,250px),1fr));gap:10px}
.mcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px;display:grid;gap:8px;cursor:pointer;text-align:left;border-top:4px solid var(--line)}
.mcard.st-Running{border-top-color:var(--ok)}.mcard.st-Watch{border-top-color:var(--warn)}.mcard.st-Breakdown{border-top-color:var(--crit)}.mcard.st-UnderPM{border-top-color:var(--info)}.mcard.st-Idle{border-top-color:var(--muted)}
.mcard .nm{font-family:var(--f-display);font-size:1.25rem;line-height:1.1}
.hbar{height:6px;border-radius:3px;background:var(--sunk);overflow:hidden}
.hbar i{display:block;height:100%}
.hrow{display:grid;grid-template-columns:34px 1fr 30px;gap:6px;align-items:center;font-size:.75rem;color:var(--muted)}

.seg{display:inline-flex;border:1px solid var(--line);border-radius:9px;overflow:hidden;flex-wrap:wrap}
.seg button{border:0;background:var(--surface);padding:8px 12px;cursor:pointer;font-weight:600;font-size:.85rem;min-height:40px}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}

label.f{display:grid;gap:4px;font-size:.85rem;font-weight:600}
input[type=text],input[type=number],input[type=date],input[type=datetime-local],input[type=search],select,textarea{width:100%;min-height:42px;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink)}
textarea{min-height:70px;resize:vertical}
.form{display:grid;gap:12px}
.form .two{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}
.advice{border:1px solid var(--line);border-left:5px solid var(--accent);background:var(--accent-soft);border-radius:8px;padding:10px 12px}

.tblwrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:.86rem}
th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{font-size:.72rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);background:var(--sunk);position:sticky;top:0;white-space:nowrap}
td.n,th.n{text-align:right;font-family:var(--f-mono);font-variant-numeric:tabular-nums}
tr:last-child td{border-bottom:0}
.heat td.c{text-align:center;font-family:var(--f-mono);cursor:pointer;min-width:52px}
.pmgrid td,.pmgrid th{padding:0;text-align:center;min-width:26px;height:28px;font-size:.7rem}
.pmgrid td.mn,.pmgrid th.mn{text-align:left;padding:4px 8px;min-width:150px;position:sticky;left:0;background:var(--surface);z-index:1}
.pmgrid th.mn{background:var(--sunk)}
.pc{display:block;margin:2px;border-radius:4px;line-height:24px;font-weight:600}
.pc.W{background:var(--info-soft);color:var(--info)}.pc.M{background:var(--accent-soft);color:var(--accent)}.pc.D{color:var(--muted)}
.pc.done{background:var(--ok-soft);color:var(--ok)}.pc.nok{background:var(--crit-soft);color:var(--crit)}.pc.miss{outline:2px solid var(--crit);outline-offset:-2px}
.pmgrid th.today{color:var(--accent)}
.pmgrid th.sun,.pmgrid td.sun{background:var(--sunk)}

.jc-m{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.jc-h{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 12px;background:var(--sunk);flex-wrap:wrap}
.jc-t{display:grid;grid-template-columns:1fr auto;gap:8px 12px;padding:10px 12px;border-top:1px solid var(--line);align-items:center}
.jc-t .q{min-width:0}
.jc-t .fq{font-size:.7rem;font-weight:700;border-radius:4px;padding:1px 6px;margin-right:6px;background:var(--sunk);color:var(--muted)}
.jc-t .fq.W{background:var(--info-soft);color:var(--info)}.jc-t .fq.M{background:var(--accent-soft);color:var(--accent)}
.tick{display:inline-flex;gap:4px}
.tick button{min-width:52px;min-height:40px;border-radius:8px;border:1px solid var(--line);background:var(--surface);font-weight:700;font-size:.78rem;cursor:pointer}
.tick button.on.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.tick button.on.nok{background:var(--crit);border-color:var(--crit);color:#fff}
.tick button.on.na{background:var(--muted);border-color:var(--muted);color:var(--bg)}
.jc-t .rem{grid-column:1/-1}
.progress{height:10px;background:var(--sunk);border-radius:5px;overflow:hidden}
.progress i{display:block;height:100%;background:var(--ok)}

.stepper{display:flex;gap:4px;flex-wrap:wrap}
.stepper button{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:4px 10px;font-size:.75rem;font-weight:600;cursor:pointer;color:var(--muted);min-height:32px}
.stepper button.past{background:var(--ok-soft);color:var(--ok);border-color:transparent}
.stepper button.cur{background:var(--ink);color:var(--bg);border-color:var(--ink)}

.sheet-bg{position:fixed;inset:0;background:rgba(10,15,20,.55);z-index:50;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:min(720px,100%);max-height:92vh;overflow:auto;border-radius:16px 16px 0 0;padding:16px 16px calc(20px + env(safe-area-inset-bottom,0px))}
@media(min-width:760px){.sheet-bg{align-items:center}.sheet{border-radius:16px}}
.sheet-h{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:12px;position:sticky;top:-16px;background:var(--bg);padding:6px 0;z-index:2}
.toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:9px;z-index:80;font-weight:600;max-width:90vw}
.fab{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:30;background:var(--crit);color:#fff;border:0;border-radius:99px;padding:14px 20px;font-weight:700;font-size:1rem;box-shadow:0 6px 18px rgba(0,0,0,.25);cursor:pointer}
svg text{fill:var(--muted);font-family:var(--f-body)}
pre.report{white-space:pre-wrap;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;font:13px/1.5 var(--f-mono);margin:0;overflow-wrap:anywhere}
@media (prefers-reduced-motion:no-preference){.sheet{animation:up .18s ease-out}@keyframes up{from{transform:translateY(16px);opacity:.6}to{transform:none;opacity:1}}}
@media print{header.top,.fab,.noprint{display:none!important}body{background:#fff}}
</style>
</head>

const GAS=(typeof google!=='undefined'&&google.script&&google.script.run)?google.script.run:null;
let gasPending=[],gasSince=0,gasLast=null,gasBusy=false,gasErr='';
try{gasPending=JSON.parse(localStorage.getItem('dmd-pending')||'[]')}catch(e){}
const gasSavePending=()=>{try{localStorage.setItem('dmd-pending',JSON.stringify(gasPending))}catch(e){}};
const gasCall=(fn,...a)=>new Promise((res,rej)=>GAS.withSuccessHandler(res).withFailureHandler(rej)[fn](...a));
function gasQueue(c,id,obj){gasPending=gasPending.filter(p=>!(p[0]===c&&p[1]===id));gasPending.push([c,id,obj?JSON.stringify(obj):'']);gasSavePending();gasFlush()}
async function gasFlush(){
  if(gasBusy||!gasPending.length)return;gasBusy=true;
  try{const batch=gasPending.slice(0,40);await gasCall('putDocs',batch);gasPending=gasPending.slice(batch.length);gasSavePending();gasErr='';gasLast=Date.now()}
  catch(e){gasErr='offline'}
  gasBusy=false;renderSync();if(gasPending.length&&!gasErr)gasFlush();
}
async function gasPull(){
  try{const r=await gasCall('getDocs',gasSince);const pend=new Set(gasPending.map(p=>p[0]+'/'+p[1]));let ch=0;
    (r.docs||[]).forEach(([c,id,json])=>{if(!S[c]||pend.has(c+'/'+id))return;ch++;if(json)S[c][id]=JSON.parse(json);else delete S[c][id]});
    gasSince=r.now;gasLast=Date.now();gasErr='';if(ch){lsSave();if(!$('#sheet'))render();else renderTabs()}
    return r;
  }catch(e){gasErr='offline';renderSync();return null}
}
function renderSync(){const el=$('#sync');if(!el)return;
  if(MODE==='blocked')el.textContent='View only · not saving';
  else if(MODE==='shared')el.textContent=READONLY?'Shared · view only':'Shared · live for the team';
  else if(MODE==='sheet')el.textContent=gasErr?('Offline · '+gasPending.length+' to send'):gasPending.length?('Sending '+gasPending.length+'…'):('Google Sheet · synced '+(gasLast?pad(new Date(gasLast).getHours())+':'+pad(new Date(gasLast).getMinutes()):''));
  else el.textContent='Saved on this device';}

// Downtime hours per machine per YYYY-MM from breakdowns (machine stopped) + manual entries
function downtime(){
  const out={};const add=(m,ym,h)=>{out[m]=out[m]||{};out[m][ym]=(out[m][ym]||0)+h};
  Object.values(S.breakdowns).forEach(b=>{
    if(!b.stopped||!b.start)return;let s=b.start;const e=b.end||Date.now();if(e<=s)return;
    while(s<e){const d=new Date(s);const nx=new Date(d.getFullYear(),d.getMonth()+1,1).getTime();const seg=Math.min(e,nx);add(b.m,d.getFullYear()+'-'+pad(d.getMonth()+1),(seg-s)/36e5);s=seg}
  });
  Object.values(S.dtmanual).forEach(r=>{if(r.h)add(r.m,r.ym,+r.h)});
  return out;
}
function workDays(ym){const[y,m]=ym.split('-').map(Number);const n=new Date(y,m,0).getDate();let c=0;for(let i=1;i<=n;i++)if(new Date(y,m-1,i).getDay()!==0)c++;return c}

const weeklyDay=i=>(i%6)+1; // Mon..Sat staggered
function monthlyDate(i,y,mo){let day=2+((i*3)%25);let d=new Date(y,mo,day);if(d.getDay()===0)d=new Date(y,mo,day+1);return d.getDate()}
function dueOn(ds,disc){
  const d=parseD(ds);if(d.getDay()===0)return[];
  return TASKS.filter(t=>(!disc||disc==='ALL'||t.d===disc)&&(t.f==='D'||(t.f==='W'&&d.getDay()===weeklyDay(t.mi))||(t.f==='M'&&d.getDate()===monthlyDate(t.mi,d.getFullYear(),d.getMonth()))));
}
function ticksOn(ds){const r={};Object.values(S.jobcards).forEach(j=>{if(j.date!==ds)return;Object.entries(j.ticks||{}).forEach(([k,v])=>{if(!r[k]||v.s==='nok')r[k]=Object.assign({by:j.tech},v)})});return r}
function pmStats(ds,disc){const due=dueOn(ds,disc);const tk=ticksOn(ds);let done=0,nok=0;due.forEach(t=>{if(tk[t.id]){done++;if(tk[t.id].s==='nok')nok++}});return{due:due.length,done,nok}}

function stockKey(n){let h=0;for(const ch of String(n))h=(h*31+ch.charCodeAt(0))|0;return 'i_'+String(n).replace(/[^A-Za-z0-9]/g,'_').slice(0,80)+'_'+(h>>>0).toString(36)}
function masterAt(){return MODE==='sheet'?0:((S.stock.master||{}).at||0)}
let MASTER_LOADED=0;
function syncMaster(){if(MODE==='sheet')return;const m=S.stock.master;if(m&&m.rows&&m.at!==MASTER_LOADED){SPARES=m.rows.map(r=>r.slice());MASTER_LOADED=m.at;STOCK_SRC='Tally import '+fmtDT(m.at)}}
function critIdx(c){const o=[];SPARES.forEach((s,i)=>{if(c.re.test(String(s[0]).toUpperCase()))o.push(i)});return o}
function critHits(c){return critIdx(c).map(i=>SPARES[i])}
function stockOf(c){const ov=MODE==='sheet'?null:S.stock['crit_'+c.k];if(ov&&ov.q!=null&&(ov.updatedAt||0)>masterAt())return{q:+ov.q,src:'Updated '+fmtD(ov.updatedAt)};const ix=critIdx(c);if(!ix.length)return{q:0,src:'Not found in stores list',missing:true};return{q:ix.reduce((a,i)=>a+spareQty(i),0),src:STOCK_SRC}}
function spareQty(i){if(MODE==='sheet')return +SPARES[i][1]||0;const ov=S.stock[stockKey(SPARES[i][0])];return ov&&ov.q!=null&&(ov.updatedAt||0)>masterAt()?+ov.q:+SPARES[i][1]||0}
function catOf(n){n=String(n).toUpperCase();const R=[['Bobcat',/BOBCAT/],['Power tools',/ARMATURE|FIELD (COIL|CASE)|MAKITA|KPT|BOSCH|GRINDER|HAND DRILL|COLLET|GEAR & PINION|PENCIL/],['Furnace & HT',/INDUCTO|FURNACE|THERMOCOUPLE|CERAMIC|SCR|THYRISTOR|DIODE|ELEMENT-|KETTLE/],['Electrical',/CONTACTOR|MCB|MCCB|FUSE|RELAY|CABLE|LUG|SWITCH|CAPACITOR|COIL|SENSOR|TRANSFORMER|LAMP|TERMINAL|AMMETER|CONTROLLER|TIMER|CARBON BRUSH|MOTOR|WIRE|PANEL/],['Bearings',/BEARING|PLUMMER|BUSH/],['Belts & drives',/BELT|PULLEY|SPROCKET|CHAIN|COUPLING|GEAR|SHAFT|WHEEL|ROPE/],['Hydraulic & pneumatic',/HOSE|SEAL|CYLINDER|VALVE|FITTING|NIPPLE|UNION|ELBOW|PIPE|GASKET|O.RING|SOLENOID|FILTER|REGULATOR|CLAMP|BEND|SOCKET/],['Lubricants',/OIL|GREASE|LUBRIC/]];for(const[c,re]of R)if(re.test(n))return c;return 'General'}

function alerts(){
  const A=[];const now=Date.now();
  openBD().forEach(b=>{const m=MBY[b.m];const age=(now-b.start)/36e5;const crit=b.stopped||b.prio==='Critical';
    A.push({k:'bd_'+b.id+'_'+b.status,sev:crit?'crit':'warn',t:(b.stopped?'Breakdown: ':'Defect: ')+m.n,d:b.sym+' · '+b.status+' · '+(age<48?hrs(age)+' h':Math.floor(age/24)+' days')+' open',go:()=>bdSheet(b.id)})});
  const td=today();const yd=dstr(new Date(Date.now()-864e5));
  Object.values(S.jobcards).forEach(j=>{if(j.date<dstr(new Date(Date.now()-7*864e5)))return;Object.entries(j.ticks||{}).forEach(([k,v])=>{if(v.s!=='nok'||v.raised)return;const t=TASKS.find(x=>x.id===k);if(!t)return;A.push({k:'nok_'+j.id+'_'+k,sev:'crit',t:'NOT OK: '+MBY[t.m].n,d:t.text+(v.r?' — '+v.r:'')+' · '+j.tech+' · '+fmtD(j.date),go:()=>newBD({m:t.m,d:t.d,sym:t.text+' — NOT OK',desc:v.r||'',fromTick:{jc:j.id,task:k}})})})});
  const ys=pmStats(yd);if(parseD(yd).getDay()!==0&&ys.due&&ys.done<ys.due)A.push({k:'pm_'+yd,sev:'warn',t:'PM checks missed yesterday',d:(ys.due-ys.done)+' of '+ys.due+' checks not ticked on '+fmtD(yd),go:()=>go('pm')});
  const h=new Date().getHours();const ts=pmStats(td);if(h>=14&&ts.due&&ts.done<ts.due*0.5)A.push({k:'pmt_'+td,sev:'warn',t:'Today\'s PM behind',d:ts.done+' of '+ts.due+' checks done by '+h+':00',go:()=>go('job')});
  CRIT.forEach(c=>{const st=stockOf(c);if(st.q<c.min){const src=Object.values(S.sourcing).find(s=>s.crit===c.k&&s.stage!=='Received');A.push({k:'low_'+c.k+'_'+st.q,sev:c.pr==='IMMEDIATE'?'crit':'warn',t:'Low stock: '+c.n,d:'Stock '+st.q+' / min '+c.min+' '+c.u+' · '+MBY[c.m].n+(st.missing?' · not in stores list':'')+(src?' · on order ('+src.stage+')':' · no indent yet'),go:()=>{go('spares')}})}});
  Object.values(S.sourcing).forEach(s=>{if(s.stage==='Received'||!s.eta)return;if(s.eta<td)A.push({k:'eta_'+s.id+'_'+s.eta,sev:'warn',t:'Sourcing overdue: '+s.item,d:'ETA was '+fmtD(s.eta)+' · '+s.stage+(s.vendor?' · '+s.vendor:''),go:()=>srcSheet(s.id)})});
  MACHINES.forEach(m=>['M','E'].forEach(d=>{const p=m[d];if(p&&p.h!=null&&p.h<25)A.push({k:'hl_'+m.id+d,sev:'warn',t:'Health '+p.h+'/100: '+m.n+' ('+(d==='M'?'Mech':'Elec')+')',d:'Predicted driver: '+p.drv+' → '+p.act,go:()=>mSheet(m.id)})}));
  const ord={crit:0,warn:1,info:2};A.sort((a,b)=>ord[a.sev]-ord[b.sev]);
  A.forEach(a=>a.ack=S.acks[a.k]);
  return A;
}

/* ----- SHEET ----- */
function sheet(title,html,mount){
  closeSheet();const bg=document.createElement('div');bg.className='sheet-bg';bg.id='sheet';
  bg.innerHTML=`<div class="sheet" role="dialog" aria-modal="true" aria-label="${esc(title)}"><div class="sheet-h"><h3>${esc(title)}</h3><button class="btn sm ghost" id="sx">Close</button></div>${html}</div>`;
  document.body.appendChild(bg);bg.addEventListener('click',e=>{if(e.target===bg)closeSheet()});$('#sx').onclick=closeSheet;
  document.addEventListener('keydown',escClose);mount&&mount(bg);
}
function escClose(e){if(e.key==='Escape')closeSheet()}
function closeSheet(){const s=$('#sheet');if(s)s.remove();document.removeEventListener('keydown',escClose)}

function predOpts(mid,d){return [...((PRED[mid]||{})[d]||[]),...GEN[d]]}

  const dt=downtime()[id]||{};const fy=fyMonths().reduce((a,ym)=>a+(dt[ym]||0),0);
  const html=`<div class="form">
   <div class="row"><span class="pill ${statusCls(s)}">${s}</span><span class="small muted">${m.a} · FY downtime ${hrs(fy)} h${m.dt?` · history avg ${m.dt} h/yr, ${m.bd} breakdowns/yr`:''}${m.spend?` · FY25-26 spares ${inr(m.spend)}`:''}</span></div>
   <div><div class="lbl">Set status</div><div class="seg" id="mst">${['Running','Watch','Under PM','Idle'].map(x=>`<button aria-pressed="${s===x}" data-v="${x}">${x}</button>`).join('')}</div>
   <p class="small muted">A breakdown with “machine stopped” sets status to Breakdown automatically until it is closed.</p></div>
   <label class="f">Status note / condition reading<input type="text" id="mnote" value="${esc(rec.note||'')}" placeholder="e.g. Bearing temp 64 °C, oil top-up 15 L this month"></label>
   <button class="btn" id="msave">Save note</button>
   ${['M','E'].filter(d=>m[d]).map(d=>`<div class="panel"><div class="spread"><b>${d==='M'?'Mechanical':'Electrical'}</b><span class="pill ${riskCls(m[d].risk)}">${m[d].risk}${m[d].h!=null?' · health '+m[d].h:''}</span></div>
     <p class="small muted" style="margin:6px 0">Likely failure: ${esc(m[d].drv)}<br>Planned action: ${esc(m[d].act)}</p>
     <label class="f">What are you seeing?<select id="ps${d}"><option value="">Select a symptom…</option>${predOpts(id,d).map((o,i)=>`<option value="${i}">${esc(o.s)}</option>`).join('')}</select></label>
     <div id="pa${d}"></div></div>`).join('')}
   <div><div class="lbl">Recent jobs</div><div class="list" style="margin-top:6px">${hist.length?hist.map(bdRow).join(''):'<div class="empty">No breakdowns logged yet.</div>'}</div></div>

    document.querySelectorAll('#mst button').forEach(b=>b.onclick=()=>{put('machines',id,Object.assign({},S.machines[id]||{},{status:b.dataset.v}));document.querySelectorAll('#mst button').forEach(x=>x.setAttribute('aria-pressed',x===b));toast(m.n+' set to '+b.dataset.v)});
    $('#msave').onclick=()=>{put('machines',id,Object.assign({},S.machines[id]||{status:s==='Breakdown'?'Running':s},{note:$('#mnote').value.trim()}));toast('Note saved')};
    $('#mbd').onclick=()=>newBD({m:id});
    document.querySelectorAll('#sheet [data-bd]').forEach(b=>b.onclick=()=>bdSheet(b.dataset.bd));
    ['M','E'].forEach(d=>{const sel=$('#ps'+d);if(!sel)return;sel.onchange=()=>{const o=predOpts(id,d)[sel.value];const box=$('#pa'+d);if(!o){box.innerHTML='';return}
      const c=o.sp&&CRIT.find(x=>x.n===o.sp);const st=c&&stockOf(c);
      box.innerHTML=`<div class="advice" style="margin-top:8px"><div class="spread"><b>Recommended action</b><span class="pill ${riskCls(o.u)}">${o.u}</span></div><p style="margin:6px 0">${esc(o.a)}</p>${c?`<p class="small" style="margin:0">Spare: ${esc(c.n)} — stock <b>${st.q}</b> / min ${c.min} ${c.u}</p>`:''}</div>
       <div class="row" style="margin-top:8px"><button class="btn sm danger" id="pb${d}">Log as defect / breakdown</button>${c?`<button class="btn sm" id="pi${d}">Raise indent</button>`:''}</div>`;
      $('#pb'+d).onclick=()=>newBD({m:id,d,sym:o.s,desc:'Recommended: '+o.a,prio:o.u==='CRITICAL'?'Critical':'High'});
      if(c)$('#pi'+d).onclick=()=>srcSheet(null,{item:c.n,m:id,crit:c.k,qty:Math.max(c.min-st.q,1)+' '+c.u,prio:c.pr==='IMMEDIATE'?'Critical':'High'});
    }});
  });
}

/* ----- BREAKDOWNS ----- */
const BD_ST=['Reported','Attending','Waiting for spares','Under trial','Closed'];
const ROOT=['Wear & tear','Lubrication failure','Electrical fault','Hydraulic / seal failure','Operator error','Spare quality','Overload','Design / installation','Other'];
let bdFilter='open';
function bdDur(b){if(!b.start)return 0;return((b.end||Date.now())-b.start)/36e5}
function bdRow(b){const m=MBY[b.m]||{n:b.m};const sev=b.status==='Closed'?'ok':b.stopped?'crit':'warn';
 return `<div class="item s-${sev}" data-bd="${b.id}" style="cursor:pointer"><span class="stripe"></span><div class="body"><div class="t">${esc(m.n)} <span class="small muted">· ${b.d==='E'?'Elec':'Mech'}</span></div><div class="d">${esc(b.sym)}${b.assigned?' · '+esc(b.assigned):''}</div><div class="d">${fmtDT(b.start)}${b.stopped?' · down '+hrs(bdDur(b))+' h':' · running with defect'}</div></div><span class="pill ${b.status==='Closed'?'p-ok':b.status==='Waiting for spares'?'p-acc':b.stopped?'p-crit':'p-warn'}">${b.status}</span></div>`}
function vBD(){
  const all=Object.values(S.breakdowns).sort((a,b)=>b.start-a.start);
  const list=bdFilter==='open'?all.filter(b=>b.status!=='Closed'):bdFilter==='closed'?all.filter(b=>b.status==='Closed'):all;
  const cl=all.filter(b=>b.status==='Closed'&&b.stopped&&b.end);const mttr=cl.length?cl.reduce((a,b)=>a+bdDur(b),0)/cl.length:null;
  return `<div class="spread"><h2>Breakdowns & defects</h2><button class="btn danger" data-act="bd">+ Report breakdown</button></div>
  <div class="row"><div class="seg">${[['open','Open'],['closed','Closed'],['all','All']].map(([k,l])=>`<button aria-pressed="${bdFilter===k}" data-bf="${k}">${l}</button>`).join('')}</div>
  <span class="small muted">${all.filter(b=>b.status!=='Closed').length} open · ${cl.length} closed with downtime${mttr!=null?' · MTTR '+hrs(mttr)+' h':''}</span></div>
  <div class="list">${list.length?list.map(bdRow).join(''):'<div class="empty">Nothing here yet. Report a breakdown from the red button; it starts the downtime clock.</div>'}</div>`;
}
bind.bd=()=>{bindCommon();document.querySelectorAll('[data-bf]').forEach(b=>b.onclick=()=>{bdFilter=b.dataset.bf;render()})};

function newBD(pre){
  const mOpts=MACHINES.map(m=>`<option value="${m.id}" ${pre.m===m.id?'selected':''}>${esc(m.n)} — ${m.a}</option>`).join('');
  const techs=team().map(t=>`<option>${esc(t.n)}</option>`).join('');
  const html=`<form class="form" id="bdf">
   <label class="f">Machine<select id="bm" required><option value="">Select machine…</option>${mOpts}</select></label>
   <div class="two"><div><div class="lbl">Type</div><div class="seg" id="bdd">${[['M','Mechanical'],['E','Electrical']].map(([k,l])=>`<button type="button" aria-pressed="${(pre.d||'M')===k}" data-v="${k}">${l}</button>`).join('')}</div></div>
   <div><div class="lbl">Is the machine stopped?</div><div class="seg" id="bds">${[['1','Yes — stopped'],['0','No — running']].map(([k,l])=>`<button type="button" aria-pressed="${(pre.stopped===false?'0':'1')===k}" data-v="${k}">${l}</button>`).join('')}</div></div></div>
   <label class="f">Problem<select id="bsym"></select></label>
   <label class="f" id="bsymo" hidden>Describe the problem<input type="text" id="bsymt" placeholder="Short description"></label>
   <label class="f">Details / observation<textarea id="bdesc" placeholder="What happened, readings, location">${esc(pre.desc||'')}</textarea></label>
   <div class="two"><label class="f">Start time<input type="datetime-local" id="bst" value="${nowLocalInput()}"></label>
   <label class="f">Priority<select id="bpr">${['Critical','High','Medium','Low'].map(p=>`<option ${(pre.prio||'High')===p?'selected':''}>${p}</option>`).join('')}</select></label></div>
   <div class="two"><label class="f">Reported by<select id="brb">${team().map(t=>`<option ${t.n===me()?'selected':''}>${esc(t.n)}</option>`).join('')}</select></label>
   <label class="f">Assign to<select id="bas"><option value="">Not assigned</option>${techs}</select></label></div>
   <button class="btn danger" type="submit">Report now</button></form>`;
  sheet('Report breakdown',html,()=>{
    let disc=pre.d||'M',stopped=pre.stopped!==false;
    const fillSym=()=>{const mid=$('#bm').value;const opts=mid?predOpts(mid,disc).map(o=>o.s):GEN[disc].map(o=>o.s);if(pre.sym&&!opts.includes(pre.sym))opts.unshift(pre.sym);$('#bsym').innerHTML=opts.map(o=>`<option ${o===pre.sym?'selected':''}>${esc(o)}</option>`).join('')+'<option value="__o">Other (type it)</option>';$('#bsymo').hidden=$('#bsym').value!=='__o'};
    fillSym();$('#bm').onchange=fillSym;$('#bsym').onchange=()=>$('#bsymo').hidden=$('#bsym').value!=='__o';
    document.querySelectorAll('#bdd button').forEach(b=>b.onclick=()=>{disc=b.dataset.v;document.querySelectorAll('#bdd button').forEach(x=>x.setAttribute('aria-pressed',x===b));fillSym()});
    document.querySelectorAll('#bds button').forEach(b=>b.onclick=()=>{stopped=b.dataset.v==='1';document.querySelectorAll('#bds button').forEach(x=>x.setAttribute('aria-pressed',x===b))});
    $('#bdf').onsubmit=e=>{e.preventDefault();const mid=$('#bm').value;if(!mid){toast('Pick the machine first');return}
      const sym=$('#bsym').value==='__o'?($('#bsymt').value.trim()||'Other'):$('#bsym').value;
      const id=uid('bd');const asg=$('#bas').value;
      put('breakdowns',id,{id,m:mid,d:disc,stopped,sym,desc:$('#bdesc').value.trim(),start:fromInput($('#bst').value)||Date.now(),prio:$('#bpr').value,by:$('#brb').value,assigned:asg,status:asg?'Attending':'Reported',log:[{t:Date.now(),by:me(),s:asg?'Attending':'Reported'}]});
      if(pre.fromTick){const j=S.jobcards[pre.fromTick.jc];if(j){const nj=JSON.parse(JSON.stringify(j));nj.ticks[pre.fromTick.task].raised=id;put('jobcards',j.id,nj)}}
      closeSheet();toast((stopped?'Breakdown':'Defect')+' reported on '+MBY[mid].n);
    };

}
function bdSheet(id){
  const b=S.breakdowns[id];if(!b)return;const m=MBY[b.m];
  const html=`<div class="form">
   <div class="row"><span class="pill ${b.stopped?'p-crit':'p-warn'}">${b.stopped?'Machine stopped':'Running with defect'}</span><span class="pill">${b.d==='E'?'Electrical':'Mechanical'}</span><span class="pill">${esc(b.prio||'')}</span></div>
   <div><b>${esc(b.sym)}</b><p class="small muted" style="margin:4px 0">${esc(b.desc||'')}</p><p class="small muted" style="margin:0">Reported ${fmtDT(b.start)} by ${esc(b.by||'—')}${b.stopped?' · downtime '+hrs(bdDur(b))+' h':''}</p></div>
   <div><div class="lbl">Status — tap to move</div><div class="stepper" id="bst">${BD_ST.map((s,i)=>{const ci=BD_ST.indexOf(b.status);return `<button type="button" class="${i<ci?'past':i===ci?'cur':''}" data-v="${s}">${s}</button>`}).join('')}</div></div>
   <div class="two"><label class="f">Assigned to<select id="bas"><option value="">Not assigned</option>${team().map(t=>`<option ${t.n===b.assigned?'selected':''}>${esc(t.n)}</option>`).join('')}</select></label>

   <label class="f">Work done / update<textarea id="bwk">${esc(b.work||'')}</textarea></label>
   <div class="two"><label class="f">Root cause<select id="brc"><option value="">—</option>${ROOT.map(r=>`<option ${r===b.root?'selected':''}>${r}</option>`).join('')}</select></label>

   <label class="f">Start time<input type="datetime-local" id="bstart" value="${nowLocalInput(b.start)}"></label>
   <div class="row"><button class="btn pri" id="bsave">Save update</button>${b.status!=='Closed'?'<button class="btn" id="bclose">Close — machine back in service</button>':''}${b.spares&&b.status!=='Closed'?'<button class="btn" id="bind">Raise indent for spares</button>':''}<button class="btn ghost" id="bdel">Delete</button></div>
   <div><div class="lbl">History</div><ul class="small muted" style="margin:6px 0;padding-left:18px">${(b.log||[]).map(l=>`<li>${fmtDT(l.t)} · ${esc(l.s)} · ${esc(l.by)}</li>`).join('')}</ul></div></div>`;
  sheet(m.n,html,()=>{
    let status=b.status;
    document.querySelectorAll('#bst button').forEach(x=>x.onclick=()=>{status=x.dataset.v;const ci=BD_ST.indexOf(status);document.querySelectorAll('#bst button').forEach((y,i)=>y.className=i<ci?'past':i===ci?'cur':'');if(status==='Closed'&&!$('#ben').value)$('#ben').value=nowLocalInput()});

    $('#bsave').onclick=()=>save(false);

  });
}

/* ----- Tally stock import (inside the app) ----- */
function parseCSVLine(l,sep){const o=[];let cur='',q=false;for(let i=0;i<l.length;i++){const ch=l[i];if(q){if(ch==='"'){if(l[i+1]==='"'){cur+='"';i++}else q=false}else cur+=ch}else if(ch==='"')q=true;else if(ch===sep){o.push(cur);cur=''}else cur+=ch}o.push(cur);return o}
function parseStockRows(table){
  const old={};SPARES.forEach(s=>old[String(s[0]).toUpperCase()]=s);const out=[];
  table.forEach(r=>{const name=String(r[0]??'').trim();if(!name||/^(grand\s*)?total|^particulars/i.test(name))return;
    let qv=r[1],unit='';if(qv==null||qv==='')return;
    if(typeof qv!=='number'){const mm=String(qv).replace(/,/g,'').match(/^\s*(-?[\d.]+)\s*([A-Za-z]+)?/);if(!mm)return;qv=+mm[1];unit=mm[2]||''}
    if(isNaN(qv))return;const p=old[name.toUpperCase()];const rate=parseFloat(String(r[2]??'').replace(/[^\d.]/g,''))||(p?+p[3]:0);
    out.push([name,+qv,(unit||(p?p[2]:'NOS')).toUpperCase(),rate,p?p[4]:catOf(name)])});
  return out;
}
function textToTable(txt){const lines=txt.replace(/\r/g,'').split('\n').filter(l=>l.trim());const sep=lines.some(l=>l.includes('\t'))?'\t':',';return lines.map(l=>parseCSVLine(l,sep))}
async function xlsxToTable(file){
  if(!window.XLSX){await new Promise((res,rej)=>{const s=document.createElement('script');s.src='https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';s.onload=res;s.onerror=rej;document.head.appendChild(s)})}
  const wb=XLSX.read(await file.arrayBuffer());return XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1,raw:true,defval:''});
}

function vDT(){

  const sh=cfg().shiftHrs;

  const max=Math.max(histAvg*1.6,...tot,1);
  const W=720,H=220,L=40,B=28,T=14,bw=(W-L-10)/12;
  const yv=v=>T+(H-T-B)*(1-v/max);
  const ticks=[0,max/2,max].map(v=>Math.round(v));
  const svg=`<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Monthly downtime hours">
   ${ticks.map(v=>`<line x1="${L}" x2="${W-6}" y1="${yv(v)}" y2="${yv(v)}" stroke="var(--line)" stroke-width="1"/><text x="${L-6}" y="${yv(v)+4}" text-anchor="end" font-size="11">${v}</text>`).join('')}

   <line x1="${L}" x2="${W-6}" y1="${yv(histAvg)}" y2="${yv(histAvg)}" stroke="var(--crit)" stroke-dasharray="5 4" stroke-width="1.5"/><text x="${W-8}" y="${yv(histAvg)-5}" text-anchor="end" font-size="11" style="fill:var(--crit)">FY23–26 avg ${histAvg.toFixed(1)} h/month</text></svg>`;
  const ytd=tot.reduce((a,b)=>a+b,0);

  <div class="kpi"><span class="lbl">This month</span><span class="v">${hrs(tot[fy.indexOf(curYM)]||0)}<span class="small muted"> h</span></span><span class="small muted">${ymLabel(curYM)}</span></div>
  <div class="kpi"><span class="lbl">Breakdowns this FY</span><span class="v">${Object.values(S.breakdowns).filter(b=>b.stopped&&dstr(new Date(b.start)).slice(0,7)>=fy[0]).length}</span><span class="small muted">machine stopped</span></div></div>
  <section class="panel"><h3>Monthly total</h3>${svg}<p class="small muted" style="margin:4px 0 0">Calculated from breakdowns marked “machine stopped” (start → back in service), split across months. Red line: historical average from the breakdown register (Roll Over, Mixer, Shot Blast, Shake Out, EOT cranes).</p></section>
  <section><div class="spread"><h3>Machine × month (hours)</h3><span class="small muted">Tap a cell to add hours not logged as a breakdown (e.g. back-fill Apr–Sep)</span></div>
  <div class="tblwrap"><table class="heat"><thead><tr><th>Machine</th>${fy.map(ym=>`<th class="n">${ymLabel(ym)}</th>`).join('')}<th class="n">FY total</th><th class="n">Avail. %</th><th class="n">Hist. h/yr</th></tr></thead><tbody>
  ${MACHINES.map(m=>{const r=dt[m.id]||{};let s=0,avail=0;const cells=fy.map(ym=>{const v=r[ym]||0;s+=v;if(ym<=curYM)avail+=workDays(ym)*sh;const a=Math.min(1,v/40);
    return `<td class="c" data-dt="${m.id}|${ym}" style="${v?`background:color-mix(in srgb,var(--crit) ${Math.round(10+a*60)}%,transparent)`:''}">${v?hrs(v):'<span class="muted">·</span>'}</td>`}).join('');
    const av=avail?(1-s/avail)*100:100;return `<tr><td><b>${esc(m.n)}</b></td>${cells}<td class="n"><b>${hrs(s)}</b></td><td class="n" style="color:${av<95?'var(--crit)':av<98?'var(--warn)':'var(--ok)'}">${av.toFixed(1)}</td><td class="n muted">${m.dt??'—'}</td></tr>`}).join('')}
  <tr><td><b>Total</b></td>${tot.map(v=>`<td class="n"><b>${v?hrs(v):'·'}</b></td>`).join('')}<td class="n"><b>${hrs(ytd)}</b></td><td></td><td class="n muted">${MACHINES.reduce((a,m)=>a+(m.dt||0),0).toFixed(1)}</td></tr></tbody></table></div>

/* ----- DAILY UPDATE ----- */
function reportText(){
  const td=today();const d=new Date();const st=MACHINES.map(m=>[m,mStatus(m.id)]);
  const c=k=>st.filter(x=>x[1]===k).length;const ps=pmStats(td);const yd=dstr(new Date(Date.now()-864e5));const ys=pmStats(yd);
  const dt=downtime();const ym=td.slice(0,7);let mtd=0,fyt=0;const fy=fyMonths();Object.values(dt).forEach(r=>{mtd+=r[ym]||0;fy.forEach(m=>fyt+=r[m]||0)});
  const L=[];
  L.push('*DATRE FALTA — MAINTENANCE DAILY UPDATE*');
  L.push(DOW[d.getDay()]+', '+fmtD(td)+'  ·  '+pad(d.getHours())+':'+pad(d.getMinutes())+'  ·  by '+me());
  L.push('');
  L.push('*Machines:* '+c('Running')+' running · '+c('Breakdown')+' breakdown · '+c('Watch')+' watch · '+c('Under PM')+' under PM · '+c('Idle')+' idle');
  const bd=openBD();L.push('');L.push('*Open breakdowns / defects ('+bd.length+'):*');
  if(!bd.length)L.push('• None');
  bd.forEach(b=>L.push('• '+MBY[b.m].n+' — '+b.sym+' — '+b.status+(b.stopped?' — DOWN '+hrs(bdDur(b))+' h':' — running')+(b.assigned?' — '+b.assigned:'')+(b.spares?' — spares: '+b.spares:'')));
  const closed=Object.values(S.breakdowns).filter(b=>b.status==='Closed'&&b.end&&b.end>Date.now()-864e5);
  if(closed.length){L.push('');L.push('*Closed in last 24 h:*');closed.forEach(b=>L.push('• '+MBY[b.m].n+' — '+b.sym+' — '+(b.root||'')+(b.stopped?' — '+hrs(bdDur(b))+' h down':'')))}
  L.push('');L.push('*PM checks:* today '+ps.done+'/'+ps.due+(ps.nok?' ('+ps.nok+' NOT OK)':'')+' · yesterday '+ys.done+'/'+ys.due+(ys.due?' ('+Math.round(ys.done/ys.due*100)+'%)':''));
  L.push('*Downtime:* '+MON[d.getMonth()]+' to date '+hrs(mtd)+' h · FY to date '+hrs(fyt)+' h');
  const low=CRIT.filter(x=>stockOf(x).q<x.min);
  L.push('');L.push('*Critical spares below minimum ('+low.length+'):*');
  low.forEach(x=>{const on=Object.values(S.sourcing).find(s=>s.crit===x.k&&s.stage!=='Received');L.push('• '+x.n+' — '+stockOf(x).q+'/'+x.min+' '+x.u+' — '+(on?on.stage:'NO INDENT'))});
  const src=Object.values(S.sourcing).filter(s=>s.stage!=='Received');
  if(src.length){L.push('');L.push('*Sourcing pending ('+src.length+'):*');src.sort((a,b)=>(a.eta||'9').localeCompare(b.eta||'9')).slice(0,10).forEach(s=>L.push('• '+s.item+' — '+s.stage+(s.eta?' — ETA '+fmtD(s.eta)+(s.eta<td?' (OVERDUE)':''):'')+(s.vendor?' — '+s.vendor:'')))}
  const crit=alerts().filter(a=>!a.ack&&a.sev==='crit'&&!a.k.startsWith('bd_')&&!a.k.startsWith('low_'));
  if(crit.length){L.push('');L.push('*Other critical alerts:*');crit.slice(0,8).forEach(a=>L.push('• '+a.t+' — '+a.d))}
  return L.join('\n');
}

lsLoad();
if(GAS){
  MODE='sheet';render();
  (async()=>{
    const pendSnap=gasPending.slice();
    try{const r=await gasCall('getDocs',0);
      const keep={};pendSnap.forEach(([c,id])=>{if(S[c]&&S[c][id])(keep[c]=keep[c]||{})[id]=S[c][id]});
      COLLS.forEach(c=>S[c]=Object.assign({},keep[c]||{}));
      (r.docs||[]).forEach(([c,id,json])=>{if(!S[c]||(keep[c]&&keep[c][id]))return;if(json)S[c][id]=JSON.parse(json)});
      gasSince=r.now;gasLast=Date.now();
      if(!(r.docs||[]).length&&!pendSnap.length){seedLocal(true);['breakdowns','sourcing'].forEach(c=>Object.entries(S[c]).forEach(([id,o])=>gasQueue(c,id,o)))}
      lsSave();render();
    }catch(e){gasErr='offline';render()}
    gasFlush();loadStock();
    setInterval(()=>{gasFlush();gasPull()},20000);
    setInterval(async()=>{try{if(applyStock(await gasCall('getStock',STOCK_VER))&&!$('#sheet'))render()}catch(e){}},60000);
    document.addEventListener('visibilitychange',()=>{if(!document.hidden){gasFlush();gasPull()}});
  })();
}else if(!inFrame)seedLocal();
render();
setInterval(()=>{if(!$('#sheet'))render()},60000);
if(inFrame){
  (async()=>{
    let db=null;try{db=await window.claude.use('db')}catch(e){}
    if(!db){MODE='blocked';COLLS.forEach(c=>S[c]={});render();return}
    DB=db;MODE='shared';COLLS.forEach(c=>S[c]={});render();
    try{const u=await window.claude.use('user');if(u){const w=await u.can('data.write');if(w===false)READONLY=true}}catch(e){}
    COLLS.forEach(c=>{
      const q=c==='jobcards'?db.collection(c).orderBy('date','desc').limit(600):db.collection(c);
      q.onSnapshot(snap=>{const o={};snap.docs.forEach(d=>{const v=d.data();if(v)o[d.id]=v});S[c]=o;if(!$('#sheet'))render();else renderTabs()},err=>{if(err&&err.code==='revoked'){DB=null;MODE='local';render()}});
    });
  })();
}
