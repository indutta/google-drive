<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Datre MIS</title>
<meta name="theme-color" content="#0b3a4a">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="app">
  <header class="top">
    <h1><span>Datre MIS <small>FY 2026-27</small></span><button class="theme" id="theme" type="button" aria-label="Switch light or dark theme">Theme</button></h1>
    <p class="period" id="period"></p>
    <div class="filters">
      <label>Period<select id="f-period"></select></label>
      <label>Customer<select id="f-cust"></select></label>
      <label>From<select id="f-from"></select></label>
      <label>To<select id="f-to"></select></label>
      <button id="f-reset" type="button">Reset</button>
    </div>
  </header>
  <main>
    <section class="view" id="v-home"></section>
    <section class="view" id="v-trends"></section>
    <section class="view" id="v-cust"></section>
    <section class="view" id="v-pl"></section>
    <section class="view" id="v-check"></section>
  </main>
  <nav class="tabs" aria-label="Sections"><div>
    <button data-tab="home" aria-selected="true" type="button"><svg viewBox="0 0 24 24"><path d="M3 11l9-8 9 8M5 10v10h5v-6h4v6h5V10"/></svg>Home</button>
    <button data-tab="trends" aria-selected="false" type="button"><svg viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>Trends</button>
    <button data-tab="cust" aria-selected="false" type="button"><svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.6-3.6 3.2-5.5 6.5-5.5s5.9 1.9 6.5 5.5M16 4.8a3.5 3.5 0 010 6.4M18 14.8c2 .6 3.3 2.3 3.6 5.2"/></svg>Customers</button>
    <button data-tab="pl" aria-selected="false" type="button"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 10h18M9 4v16"/></svg>P&amp;L</button>
    <button data-tab="check" aria-selected="false" type="button"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M8 12.5l2.7 2.7L16 9.5"/></svg>Checks</button>
  </div></nav>
</div>
<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
