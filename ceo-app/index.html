<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#14171c" />
<link rel="manifest" href="manifest.webmanifest" />
<link rel="icon" href="icons/icon.svg" type="image/svg+xml" />
<title>Plant Pulse</title>
<style>
  :root{
    color-scheme: light;
    --page:#f4f3ef; --surface:#ffffff; --surface-2:#eceae4;
    --text:#111111; --text-2:#52514e; --text-3:#6f6d67;
    --border:rgba(17,17,17,0.12); --accent:#2a78d6;
    --good:#0b7a3b; --warning:#a86a00; --serious:#b54a1c; --critical:#c42b2b;
    --good-bg:#e3f3e8; --warning-bg:#fbefd2; --serious-bg:#fbe5da; --critical-bg:#fbdede;
    --shadow:0 1px 2px rgba(0,0,0,.06), 0 4px 14px rgba(0,0,0,.06);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      color-scheme: dark;
      --page:#0e1013; --surface:#1a1d22; --surface-2:#252930;
      --text:#f3f3f1; --text-2:#c3c2b7; --text-3:#9a988f;
      --border:rgba(255,255,255,0.12); --accent:#5aa0f0;
      --good:#4cc47a; --warning:#f2b84b; --serious:#f0906a; --critical:#f27c7c;
      --good-bg:#16301f; --warning-bg:#33290f; --serious-bg:#38200f; --critical-bg:#3a1717;
      --shadow:none;
    }
  }
  :root[data-theme="dark"]{
    color-scheme: dark;
    --page:#0e1013; --surface:#1a1d22; --surface-2:#252930;
    --text:#f3f3f1; --text-2:#c3c2b7; --text-3:#9a988f;
    --border:rgba(255,255,255,0.12); --accent:#5aa0f0;
    --good:#4cc47a; --warning:#f2b84b; --serious:#f0906a; --critical:#f27c7c;
    --good-bg:#16301f; --warning-bg:#33290f; --serious-bg:#38200f; --critical-bg:#3a1717;
    --shadow:none;
  }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{ margin:0; background:var(--page); color:var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  body{ padding-bottom:env(safe-area-inset-bottom); }
  button{ font:inherit; color:inherit; }
  .wrap{ max-width:560px; margin:0 auto; padding:0 16px 40px; }

  header{ position:sticky; top:0; z-index:10; background:var(--page);
    padding:calc(env(safe-area-inset-top) + 12px) 16px 10px; border-bottom:1px solid var(--border); }
  .hrow{ max-width:560px; margin:0 auto; display:flex; align-items:center; gap:10px; }
  .htitle{ flex:1; min-width:0; }
  .htitle h1{ margin:0; font-size:20px; letter-spacing:-.01em; }
  .htitle p{ margin:2px 0 0; font-size:13px; color:var(--text-2); }
  .iconbtn{ width:44px; height:44px; border-radius:12px; border:1px solid var(--border);
    background:var(--surface); display:grid; place-items:center; cursor:pointer; }
  .iconbtn svg{ width:20px; height:20px; }
  .iconbtn.spin svg{ animation:spin .8s linear infinite; }
  @keyframes spin{ to{ transform:rotate(360deg);} }

  .banner{ margin:12px 0 0; padding:10px 12px; border-radius:12px; font-size:13px; line-height:1.4;
    background:var(--warning-bg); color:var(--warning); border:1px solid var(--border); }
  .banner[hidden]{ display:none; }
  .banner.offline{ background:var(--surface-2); color:var(--text-2); }

  .summary{ margin:14px 0 6px; padding:16px; border-radius:16px; background:var(--surface);
    box-shadow:var(--shadow); border:1px solid var(--border); display:flex; gap:14px; align-items:center; }
  .ring{ width:64px; height:64px; flex:0 0 auto; }
  .summary h2{ margin:0; font-size:17px; }
  .summary p{ margin:3px 0 0; font-size:13px; color:var(--text-2); }

  h3.sec{ margin:22px 0 8px; font-size:12px; letter-spacing:.08em; text-transform:uppercase; color:var(--text-3); font-weight:700; }

  .attn{ list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:8px; }
  .attn button{ width:100%; text-align:left; display:flex; gap:10px; align-items:flex-start; padding:12px;
    border-radius:12px; border:1px solid var(--border); background:var(--surface); cursor:pointer; min-height:56px; }
  .attn .t{ flex:1; font-size:14px; line-height:1.35; }
  .attn .a{ display:block; font-size:12px; color:var(--text-3); margin-bottom:2px; font-weight:600; }

  .grid{ display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .tile{ text-align:left; padding:14px; border-radius:16px; border:1px solid var(--border);
    background:var(--surface); box-shadow:var(--shadow); cursor:pointer; min-height:132px;
    display:flex; flex-direction:column; gap:6px; position:relative; }
  .tile:active{ transform:scale(.98); }
  .tile .top{ display:flex; align-items:center; justify-content:space-between; gap:6px; }
  .tile .ic{ width:34px; height:34px; border-radius:10px; display:grid; place-items:center; background:var(--surface-2); }
  .tile .ic svg{ width:19px; height:19px; }
  .tile .name{ font-size:13px; font-weight:600; color:var(--text-2); }
  .tile .big{ font-size:30px; font-weight:750; letter-spacing:-.02em; line-height:1.05; font-variant-numeric:tabular-nums; }
  .tile .unit{ font-size:12.5px; color:var(--text-2); line-height:1.3; }
  .tile .sub{ font-size:12px; color:var(--text-3); margin-top:auto; }

  .chip{ display:inline-flex; align-items:center; gap:5px; font-size:11.5px; font-weight:700;
    padding:4px 8px; border-radius:999px; white-space:nowrap; }
  .chip svg{ width:12px; height:12px; }
  .s-good{ background:var(--good-bg); color:var(--good); }
  .s-warning{ background:var(--warning-bg); color:var(--warning); }
  .s-serious{ background:var(--serious-bg); color:var(--serious); }
  .s-critical{ background:var(--critical-bg); color:var(--critical); }
  .tile.st-critical{ border-color:var(--critical); }
  .tile.st-serious{ border-color:var(--serious); }

  /* bottom sheet */
  .scrim{ position:fixed; inset:0; background:rgba(0,0,0,.45); opacity:0; pointer-events:none; transition:opacity .2s; z-index:50; }
  .scrim.show{ opacity:1; pointer-events:auto; }
  .sheet{ position:fixed; left:0; right:0; bottom:0; z-index:60; max-height:92vh; overflow-y:auto;
    background:var(--page); border-radius:20px 20px 0 0; transform:translateY(100%); transition:transform .25s ease;
    padding:8px 16px calc(env(safe-area-inset-bottom) + 24px); max-width:560px; margin:0 auto; }
  .sheet.show{ transform:none; }
  .grab{ width:40px; height:4px; border-radius:2px; background:var(--border); margin:4px auto 10px; }
  .shead{ display:flex; align-items:center; gap:10px; margin-bottom:12px; }
  .shead h2{ margin:0; font-size:20px; flex:1; }
  .kpis{ display:grid; grid-template-columns:1fr 1fr; gap:8px; }
  .kpi{ background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:12px; }
  .kpi .l{ font-size:12px; color:var(--text-2); }
  .kpi .v{ font-size:20px; font-weight:700; margin-top:3px; font-variant-numeric:tabular-nums; }
  .kpi .g{ font-size:12px; color:var(--text-3); margin-top:2px; }
  .kpi .bar{ height:4px; border-radius:2px; margin-top:8px; }
  .kpi .bar.s-good{ background:var(--good); } .kpi .bar.s-warning{ background:var(--warning); }
  .kpi .bar.s-serious{ background:var(--serious); } .kpi .bar.s-critical{ background:var(--critical); }
  .card{ background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:12px; margin-top:8px; }
  .card .l{ font-size:12px; color:var(--text-2); margin-bottom:6px; }
  .spark{ width:100%; height:92px; display:block; }
  .spark text{ fill:var(--text-3); font-size:10px; }
  .items{ list-style:none; margin:0; padding:0; }
  .items li{ display:flex; gap:10px; padding:10px 0; border-top:1px solid var(--border); font-size:14px; line-height:1.35; }
  .items li:first-child{ border-top:none; }
  .items .tm{ margin-left:auto; font-size:12px; color:var(--text-3); white-space:nowrap; padding-left:8px; }
  .dot{ width:10px; height:10px; border-radius:50%; flex:0 0 auto; margin-top:5px; }
  .d-good{ background:var(--good);} .d-warning{ background:var(--warning);}
  .d-serious{ background:var(--serious);} .d-critical{ background:var(--critical);}

  .field{ display:block; margin:10px 0; font-size:13px; color:var(--text-2); }
  .field input{ width:100%; margin-top:6px; padding:12px; border-radius:10px; border:1px solid var(--border);
    background:var(--surface); color:var(--text); font-size:15px; }
  .btn{ padding:12px 16px; border-radius:12px; border:1px solid var(--border); background:var(--surface); cursor:pointer; min-height:44px; font-weight:600; }
  .btn.primary{ background:var(--accent); color:#fff; border-color:transparent; }
  .row{ display:flex; gap:8px; flex-wrap:wrap; }
  .note{ font-size:12.5px; color:var(--text-3); line-height:1.45; }
  .skel{ height:132px; border-radius:16px; background:var(--surface-2); }
</style>
</head>
<body>
<header>
  <div class="hrow">
    <div class="htitle">
      <h1>Plant Pulse</h1>
      <p id="sub">Loading…</p>
    </div>
    <button class="iconbtn" id="refresh" aria-label="Refresh"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-3-6.7"/><path d="M21 3v6h-6"/></svg></button>
    <button class="iconbtn" id="gear" aria-label="Settings"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></button>
  </div>
</header>

<main class="wrap">
  <div class="banner" id="banner" hidden></div>
  <section class="summary" id="summary" aria-live="polite"></section>

  <h3 class="sec">Needs your attention</h3>
  <ul class="attn" id="attn"></ul>

  <h3 class="sec">Plant areas</h3>
  <div class="grid" id="grid"><div class="skel"></div><div class="skel"></div><div class="skel"></div><div class="skel"></div></div>
</main>

<div class="scrim" id="scrim"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-label="Details"></div>

<script>
/* ---------- config ---------- */
const DEFAULT_URL = "data.json";
const REFRESH_MS = 60000;
const LS = {
  get(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } },
  set(k,v){ try{ localStorage.setItem(k,v); }catch(e){} },
  del(k){ try{ localStorage.removeItem(k); }catch(e){} }
};
const dataUrl = () => LS.get("pp-url") || DEFAULT_URL;

/* ---------- helpers ---------- */
const $ = id => document.getElementById(id);
const RANK = { good:0, warning:1, serious:2, critical:3 };
const LABEL = { good:"On track", warning:"Watch", serious:"Problem", critical:"Critical" };
const ICON = {
  good:'<path d="M5 12l5 5 9-10"/>',
  warning:'<path d="M12 8v5M12 17h.01"/>',
  serious:'<path d="M12 7v6M12 17h.01"/>',
  critical:'<path d="M6 6l12 12M18 6L6 18"/>'
};
const AREA_ICON = {
  flame:'<path d="M12 3c1 4 5 5 5 10a5 5 0 0 1-10 0c0-2 1-3 2-4 0 2 1 3 2 3 0-3-1-5 1-9z"/>',
  layers:'<path d="M12 3l9 5-9 5-9-5 9-5z"/><path d="M3 13l9 5 9-5"/>',
  thermo:'<path d="M14 14V5a2 2 0 0 0-4 0v9a4 4 0 1 0 4 0z"/>',
  check:'<circle cx="12" cy="12" r="9"/><path d="M8 12l3 3 5-6"/>',
  wrench:'<path d="M14.7 6.3a4 4 0 0 0-5 5L3 18l3 3 6.7-6.7a4 4 0 0 0 5-5l-2.4 2.4-2.6-.6-.6-2.6z"/>',
  truck:'<path d="M2 6h11v10H2zM13 9h4l4 4v3h-8z"/><circle cx="7" cy="18" r="2"/><circle cx="17" cy="18" r="2"/>'
};
const svgI = (p, extra="") => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" ${extra}>${p}</svg>`;
const chip = s => `<span class="chip s-${s}">${svgI(ICON[s])}${LABEL[s]}</span>`;
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const worst = list => list.reduce((a,b) => RANK[b] > RANK[a] ? b : a, "good");

function ago(iso){
  const t = Date.parse(iso); if(isNaN(t)) return "";
  const m = Math.round((Date.now()-t)/60000);
  if(m < 1) return "just now";
  if(m < 60) return m + " min ago";
  const h = Math.round(m/60);
  if(h < 24) return h + " h ago";
  return Math.round(h/24) + " d ago";
}

/* ---------- data ---------- */
let STATE = { data:null, offline:false, error:null };

async function load(manual){
  const btn = $("refresh"); btn.classList.add("spin");
  const url = dataUrl();
  const sep = url.includes("?") ? "&" : "?";
  try{
    const res = await fetch(url + sep + "t=" + Date.now(), { cache:"no-store" });
    if(!res.ok) throw new Error("HTTP " + res.status);
    const data = await res.json();
    if(!data || !Array.isArray(data.areas)) throw new Error("Data is missing the 'areas' list");
    STATE = { data, offline:false, error:null };
    LS.set("pp-cache", JSON.stringify(data));
  }catch(err){
    const cached = LS.get("pp-cache");
    let data = null;
    try{ data = cached ? JSON.parse(cached) : null; }catch(e){}
    STATE = { data: data || STATE.data, offline:true, error:err.message };
  }
  btn.classList.remove("spin");
  render();
}

/* ---------- render ---------- */
function render(){
  const { data, offline, error } = STATE;
  const banner = $("banner");
  if(!data){
    banner.hidden = false; banner.className = "banner";
    banner.textContent = "Could not load plant data (" + (error||"unknown error") + "). Check your connection and tap refresh.";
    $("sub").textContent = "No data";
    $("summary").innerHTML = ""; $("attn").innerHTML = ""; $("grid").innerHTML = "";
    return;
  }
  const msgs = [];
  if(data.sample) msgs.push("<b>Sample data.</b> These figures are illustrative, not live plant readings. Connect your data source in Settings.");
  if(offline) msgs.push("<b>Offline.</b> Showing last saved data from " + esc(ago(data.updated) || "earlier") + ".");
  banner.hidden = msgs.length === 0;
  banner.className = "banner" + (offline && !data.sample ? " offline" : "");
  banner.innerHTML = msgs.join("<br>");

  $("sub").textContent = (data.plant || "") + (data.updated && !data.sample ? " · updated " + ago(data.updated) : data.sample ? " · sample data" : "");

  const areas = data.areas;
  const counts = { good:0, warning:0, serious:0, critical:0 };
  areas.forEach(a => counts[a.status]++);
  const overall = worst(areas.map(a => a.status));
  const bad = counts.warning + counts.serious + counts.critical;
  const col = `var(--${overall})`;
  const frac = counts.good / areas.length;
  const C = 2*Math.PI*26;
  $("summary").innerHTML =
    `<svg class="ring" viewBox="0 0 64 64" aria-hidden="true">
       <circle cx="32" cy="32" r="26" fill="none" stroke="var(--surface-2)" stroke-width="8"/>
       <circle cx="32" cy="32" r="26" fill="none" stroke="${col}" stroke-width="8" stroke-linecap="round"
         stroke-dasharray="${(C*frac).toFixed(1)} ${C.toFixed(1)}" transform="rotate(-90 32 32)"/>
       <text x="32" y="37" text-anchor="middle" font-size="16" font-weight="700" fill="var(--text)">${counts.good}/${areas.length}</text>
     </svg>
     <div><h2>${counts.good} of ${areas.length} areas on track</h2>
     <p>${bad === 0 ? "Nothing needs your attention right now."
        : [counts.critical && counts.critical+" critical", counts.serious && counts.serious+" with a problem", counts.warning && counts.warning+" to watch"].filter(Boolean).join(" · ")}</p></div>`;

  // attention list: every non-good item, worst first
  const att = [];
  areas.forEach(a => (a.items||[]).forEach(it => { if(it.status !== "good") att.push({ area:a, it }); }));
  att.sort((x,y) => RANK[y.it.status] - RANK[x.it.status]);
  $("attn").innerHTML = att.length ? att.slice(0,6).map(({area,it}) =>
    `<li><button data-area="${esc(area.id)}"><span class="dot d-${it.status}" style="margin-top:6px"></span>
       <span class="t"><span class="a">${esc(area.name)} · ${LABEL[it.status]}</span>${esc(it.text)}</span></button></li>`).join("")
    : `<li class="note" style="padding:6px 2px">All clear.</li>`;

  const order = areas.slice().sort((a,b) => RANK[b.status] - RANK[a.status]);
  $("grid").innerHTML = order.map(a =>
    `<button class="tile st-${a.status}" data-area="${esc(a.id)}" aria-label="${esc(a.name)}, ${LABEL[a.status]}">
       <div class="top"><span class="ic">${svgI(AREA_ICON[a.icon]||AREA_ICON.check)}</span>${chip(a.status)}</div>
       <div class="name">${esc(a.name)}</div>
       <div class="big">${esc(a.headline.value)}</div>
       <div class="unit">${esc(a.headline.unit)}</div>
       <div class="sub">${esc(a.headline.sub||"")}</div>
     </button>`).join("");
}

function spark(t){
  const p = t.points; if(!p || p.length < 2) return "";
  const W=320, H=92, pl=6, pr=6, pt=14, pb=18;
  const min = Math.min(...p), max = Math.max(...p), span = (max-min)||1;
  const x = i => pl + i*(W-pl-pr)/(p.length-1);
  const y = v => pt + (H-pt-pb)*(1-(v-min)/span);
  const pts = p.map((v,i) => x(i).toFixed(1)+","+y(v).toFixed(1)).join(" ");
  const last = p.length-1;
  return `<svg class="spark" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(t.label)}: ${p.join(", ")}">
    <polyline points="${pts}" fill="none" stroke="var(--accent)" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
    <circle cx="${x(last)}" cy="${y(p[last])}" r="4" fill="var(--accent)"/>
    <text x="${pl}" y="${H-4}">7 days ago</text>
    <text x="${W-pr}" y="${H-4}" text-anchor="end">today ${p[last]}${esc(t.unit||"")}</text>
    <text x="${pl}" y="10">${min}${esc(t.unit||"")} – ${max}${esc(t.unit||"")}</text>
  </svg>`;
}

/* ---------- sheets ---------- */
function openSheet(html){
  const already = $("sheet").classList.contains("show");
  $("sheet").innerHTML = '<div class="grab"></div>' + html;
  $("scrim").classList.add("show"); $("sheet").classList.add("show");
  if(!already){ $("sheet").scrollTop = 0; history.pushState({sheet:1}, ""); }
}
function closeSheet(fromPop){
  if(!$("sheet").classList.contains("show")) return;
  $("scrim").classList.remove("show"); $("sheet").classList.remove("show");
  if(!fromPop && history.state && history.state.sheet) history.back();
}
window.addEventListener("popstate", () => closeSheet(true));
$("scrim").addEventListener("click", () => closeSheet());

function openArea(id){
  const a = STATE.data.areas.find(x => x.id === id); if(!a) return;
  openSheet(
    `<div class="shead"><h2>${esc(a.name)}</h2>${chip(a.status)}
       <button class="iconbtn" data-close aria-label="Close">${svgI('<path d="M6 6l12 12M18 6L6 18"/>')}</button></div>
     <div class="kpis">${a.kpis.map(k =>
        `<div class="kpi"><div class="l">${esc(k.label)}</div><div class="v">${esc(k.value)}</div>
         <div class="g">${esc(k.target||"")}</div><div class="bar s-${k.status}" title="${LABEL[k.status]}"></div>
         <div class="g" style="margin-top:4px">${LABEL[k.status]}</div></div>`).join("")}</div>
     ${a.trend ? `<div class="card"><div class="l">${esc(a.trend.label)}</div>${spark(a.trend)}</div>` : ""}
     <div class="card"><div class="l">Latest updates</div><ul class="items">${(a.items||[]).map(it =>
        `<li><span class="dot d-${it.status}"></span><span>${esc(it.text)}</span><span class="tm">${esc(it.time||"")}</span></li>`).join("")}</ul></div>`);
}

function openSettings(){
  const cur = LS.get("pp-url") || "";
  const theme = LS.get("pp-theme") || "auto";
  openSheet(
    `<div class="shead"><h2>Settings</h2>
       <button class="iconbtn" data-close aria-label="Close">${svgI('<path d="M6 6l12 12M18 6L6 18"/>')}</button></div>
     <label class="field">Data source address
       <input id="urlin" type="url" inputmode="url" placeholder="https://… (blank uses the built-in sample)" value="${esc(cur)}"></label>
     <p class="note">Point this at the JSON feed from your plant system. It must have the same shape as <code>data.json</code>
       and allow requests from this app's address.</p>
     <div class="row"><button class="btn primary" id="saveurl">Save and refresh</button>
       <button class="btn" id="resetUrl">Use sample data</button></div>
     <label class="field" style="margin-top:18px">Appearance</label>
     <div class="row">${["auto","light","dark"].map(t =>
        `<button class="btn" data-theme="${t}" ${t===theme?'style="outline:2px solid var(--accent)"':""}>${t[0].toUpperCase()+t.slice(1)}</button>`).join("")}</div>`);
}

function applyTheme(){
  const t = LS.get("pp-theme");
  if(t === "light" || t === "dark") document.documentElement.dataset.theme = t;
  else delete document.documentElement.dataset.theme;
}

document.addEventListener("click", e => {
  const el = e.target.closest("button"); if(!el) return;
  if(el.dataset.area) openArea(el.dataset.area);
  else if("close" in el.dataset) closeSheet();
  else if(el.dataset.theme){ el.dataset.theme === "auto" ? LS.del("pp-theme") : LS.set("pp-theme", el.dataset.theme); applyTheme(); openSettings(); }
  else if(el.id === "saveurl"){ const v = $("urlin").value.trim(); v ? LS.set("pp-url", v) : LS.del("pp-url"); closeSheet(); load(true); }
  else if(el.id === "resetUrl"){ LS.del("pp-url"); LS.del("pp-cache"); closeSheet(); load(true); }
});
$("refresh").addEventListener("click", () => load(true));
$("gear").addEventListener("click", openSettings);

/* ---------- boot ---------- */
applyTheme();
load();
setInterval(() => { if(!document.hidden) load(); }, REFRESH_MS);
document.addEventListener("visibilitychange", () => { if(!document.hidden) load(); });
if("serviceWorker" in navigator){ navigator.serviceWorker.register("sw.js").catch(() => {}); }
</script>
</body>
</html>
