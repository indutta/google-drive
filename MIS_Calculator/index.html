<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Datre MIS Calculator</title>
<meta name="theme-color" content="#0b3a4a">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="app">
  <header class="top">
    <div class="row1">
      <h1>MIS Calculator</h1>
      <button class="ghost" id="theme" type="button" aria-label="Switch light or dark theme">Theme</button>
    </div>
    <div class="row2">
      <label>Month<select id="month"></select></label>
      <label>Financial year<input id="fy" type="text" inputmode="text" value="2026-27" aria-label="Financial year"></label>
    </div>
  </header>
  <main>
    <section class="view" id="v-in"></section>
    <section class="view" id="v-out"></section>
    <section class="view" id="v-yr"></section>
    <section class="view" id="v-more"></section>
  </main>
  <div class="live" id="live" aria-live="polite"></div>
  <nav class="tabs" aria-label="Sections"><div>
    <button data-tab="in" type="button"><svg viewBox="0 0 24 24"><path d="M4 20h4L19 9l-4-4L4 16v4zM13.5 6.5l4 4"/></svg>Enter</button>
    <button data-tab="out" type="button"><svg viewBox="0 0 24 24"><rect x="5" y="3" width="14" height="18" rx="2"/><path d="M8 7h8M8 11h2M12 11h2M16 11h0M8 15h2M12 15h2M16 15h0"/></svg>MIS</button>
    <button data-tab="yr" type="button"><svg viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>Year</button>
    <button data-tab="more" type="button"><svg viewBox="0 0 24 24"><circle cx="5" cy="12" r="1.4"/><circle cx="12" cy="12" r="1.4"/><circle cx="19" cy="12" r="1.4"/></svg>More</button>
  </div></nav>
</div>
<script src="app.js"></script>
</body>
</html>
