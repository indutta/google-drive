<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Datre MIS Calculator</title>
<meta name="theme-color" content="#0b3a4a">
<meta name="mobile-web-app-capable" content="yes">
<style>
:root{--bg:#f3f6f7;--panel:#ffffff;--fg:#10222b;--muted:#5a6f79;--line:#dbe4e8;--head:#0b3a4a;--headfg:#ecf3f6;--c1:#0f6e8c;--c2:#c77d0a;--mute:#aebcc3;--good:#1a7f4b;--bad:#b3261e;--warn:#9a6700;--tab:#ffffff;--field:#eef3f5;--shadow:0 1px 2px rgba(16,34,43,.08)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0c1a20;--panel:#13262e;--fg:#e6eff2;--muted:#93a9b3;--line:#24404b;--head:#071f28;--headfg:#e6eff2;--c1:#4fb3d1;--c2:#e8a045;--mute:#4b6572;--good:#4cc38a;--bad:#ff8a80;--warn:#e8b84a;--tab:#10222a;--field:#0c1a20;--shadow:none;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0c1a20;--panel:#13262e;--fg:#e6eff2;--muted:#93a9b3;--line:#24404b;--head:#071f28;--headfg:#e6eff2;--c1:#4fb3d1;--c2:#e8a045;--mute:#4b6572;--good:#4cc38a;--bad:#ff8a80;--warn:#e8b84a;--tab:#10222a;--field:#0c1a20;--shadow:none;color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:16px;line-height:1.4}
#app{max-width:640px;margin:0 auto;min-height:100vh;padding-bottom:calc(8.2rem + env(safe-area-inset-bottom,0px))}
.top{background:var(--head);color:var(--headfg);padding:calc(.7rem + env(safe-area-inset-top,0px)) 16px .8rem}
.row1{display:flex;justify-content:space-between;align-items:center;gap:.5rem}
.top h1{margin:0;font-size:1.2rem;font-weight:650}
.ghost{font:inherit;font-size:.78rem;color:var(--headfg);background:transparent;border:1px solid rgba(255,255,255,.35);border-radius:999px;padding:.3rem .8rem;min-height:36px}
.row2{display:grid;grid-template-columns:1.2fr 1fr;gap:.5rem;margin-top:.6rem}
.row2 label{display:flex;flex-direction:column;gap:.15rem;font-size:.7rem;opacity:.9;min-width:0}
.row2 select,.row2 input{font:inherit;font-size:1rem;min-width:0;width:100%;min-height:44px;color:var(--headfg);background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.28);border-radius:10px;padding:.5rem .6rem}
.row2 select option{color:#10222a;background:#fff}
main{padding:14px 16px}
.view{display:none;flex-direction:column;gap:12px}
.view.on{display:flex}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);min-width:0;overflow:hidden}
.card>summary,.card>.hd{list-style:none;display:flex;align-items:center;justify-content:space-between;gap:.6rem;padding:14px;min-height:56px;cursor:pointer}
.card>summary::-webkit-details-marker{display:none}
.card h2{margin:0;font-size:1rem;font-weight:620}
.card .sub{font-size:.76rem;color:var(--muted);font-weight:400}
.badge{font-size:.72rem;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:.12rem .55rem;white-space:nowrap}
.badge.ok{color:var(--good);border-color:var(--good)}
.chev{width:18px;height:18px;stroke:var(--muted);fill:none;stroke-width:2;stroke-linecap:round;transition:transform .15s}
details[open]>summary .chev{transform:rotate(180deg)}
.fields{padding:0 14px 12px;display:flex;flex-direction:column}
.f{display:grid;grid-template-columns:1fr auto;align-items:center;gap:.2rem .6rem;padding:.45rem 0;border-top:1px solid var(--line)}
.f:first-child{border-top:0}
.f .l{font-size:.9rem;min-width:0}
.f .n{grid-column:1/-1;font-size:.72rem;color:var(--muted);margin-top:-.15rem}
.in{display:flex;align-items:center;gap:.3rem}
.in input{font:inherit;font-size:1.05rem;font-variant-numeric:tabular-nums;text-align:right;width:8.6rem;min-height:46px;color:var(--fg);background:var(--field);border:1px solid var(--line);border-radius:10px;padding:.4rem .65rem}
.in input:focus{outline:2px solid var(--c1);outline-offset:1px}
.in input.auto{color:var(--muted);font-style:italic}
.sign{font:inherit;font-size:1.1rem;width:44px;min-height:46px;color:var(--c1);background:var(--field);border:1px solid var(--line);border-radius:10px}
.live{position:fixed;left:0;right:0;bottom:calc(3.7rem + env(safe-area-inset-bottom,0px));z-index:25;display:flex;justify-content:center;pointer-events:none}
.live>div{pointer-events:auto;width:100%;max-width:640px;margin:0 8px;display:grid;grid-template-columns:repeat(3,1fr);gap:.5rem;background:var(--head);color:var(--headfg);border-radius:14px;padding:.55rem .8rem;box-shadow:0 4px 14px rgba(0,0,0,.25)}
.live span{display:block;font-size:.66rem;opacity:.8}
.live b{font-size:1rem;font-variant-numeric:tabular-nums;font-weight:650}
.live .neg{color:#ffb4ab}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px;box-shadow:var(--shadow);min-width:0}
.kpi.wide{grid-column:1/-1}
.kpi .l{font-size:.75rem;color:var(--muted)}
.kpi .v{font-size:1.6rem;font-weight:600;font-variant-numeric:tabular-nums;line-height:1.15;margin:.1rem 0}
.kpi .n{font-size:.72rem;color:var(--muted)}
.kpi .v.neg{color:var(--bad)}
.tw{overflow-x:auto;-webkit-overflow-scrolling:touch}
table{border-collapse:collapse;width:100%;font-size:.88rem;font-variant-numeric:tabular-nums}
th,td{padding:.5rem .6rem;text-align:right;white-space:nowrap;border-bottom:1px solid var(--line)}
th{font-weight:600;color:var(--muted);font-size:.74rem;background:var(--panel)}
td:first-child,th:first-child{text-align:left;position:sticky;left:0;background:var(--panel);white-space:normal;min-width:10.5rem;max-width:12rem}
tr.tot td{font-weight:650;background:color-mix(in srgb,var(--c1) 9%,var(--panel))}
tr.sec td{font-size:.72rem;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.04em;background:var(--bg)}
td.neg{color:var(--bad)}
.pad{padding:0 14px 14px}
.note{font-size:.8rem;color:var(--muted);margin:.2rem 0 0}
.chk{display:flex;flex-direction:column;gap:.4rem;padding:0 14px 14px}
.chk div{font-size:.84rem;padding:.5rem .7rem;border-radius:10px;background:var(--bg)}
.chk .warn{color:var(--warn)}.chk .good{color:var(--good)}
.btns{display:flex;flex-direction:column;gap:.6rem;padding:0 14px 14px}
.btn{font:inherit;font-size:1rem;min-height:50px;color:#fff;background:var(--c1);border:0;border-radius:12px;padding:.6rem 1rem;font-weight:600}
.btn.alt{background:transparent;color:var(--c1);border:1px solid var(--c1)}
.btn.danger{background:transparent;color:var(--bad);border:1px solid var(--bad)}
.confirm{display:flex;gap:.6rem;align-items:center;flex-wrap:wrap;padding:.6rem .8rem;border-radius:10px;background:var(--bg);font-size:.88rem}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(9.5rem + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:.55rem 1rem;border-radius:999px;font-size:.85rem;z-index:50}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--tab);border-top:1px solid var(--line);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom,0px)}
nav.tabs div{display:flex;width:100%;max-width:640px}
nav.tabs button{flex:1;font:inherit;font-size:.72rem;color:var(--muted);background:none;border:0;min-height:58px;padding:.5rem .1rem;display:flex;flex-direction:column;align-items:center;gap:.15rem}
nav.tabs button svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav.tabs button[aria-selected=true]{color:var(--c1);font-weight:650}
button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--c2);outline-offset:2px}
.empty{padding:1.2rem;text-align:center;color:var(--muted);font-size:.9rem}
</style>
</head>
<body>
<div id="app">
  <header class="top">
    <div class="row1">
      <h1>MIS Calculator</h1>
      <button class="ghost" id="theme" type="button" aria-label="Switch light or dark theme">Theme</button>
    </div>
    <div class="row2">
      <label>Month<select id="month"></select></label>
      <label>Financial year<input id="fy" type="text" inputmode="text" value="2026-27" aria-label="Financial year"></label>
    </div>
  </header>
  <main>
    <section class="view" id="v-in"></section>
    <section class="view" id="v-out"></section>
    <section class="view" id="v-yr"></section>
    <section class="view" id="v-more"></section>
  </main>
  <div class="live" id="live" aria-live="polite"></div>
  <nav class="tabs" aria-label="Sections"><div>
    <button data-tab="in" type="button"><svg viewBox="0 0 24 24"><path d="M4 20h4L19 9l-4-4L4 16v4zM13.5 6.5l4 4"/></svg>Enter</button>
    <button data-tab="out" type="button"><svg viewBox="0 0 24 24"><rect x="5" y="3" width="14" height="18" rx="2"/><path d="M8 7h8M8 11h2M12 11h2M16 11h0M8 15h2M12 15h2M16 15h0"/></svg>MIS</button>
    <button data-tab="yr" type="button"><svg viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>Year</button>
    <button data-tab="more" type="button"><svg viewBox="0 0 24 24"><circle cx="5" cy="12" r="1.4"/><circle cx="12" cy="12" r="1.4"/><circle cx="19" cy="12" r="1.4"/></svg>More</button>
  </div></nav>
</div>
<script>
(function () {
  'use strict';
  var MONTHS = ['April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December', 'January', 'February', 'March'];
  var SHORT = ['Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec', 'Jan', 'Feb', 'Mar'];
  var nf = new Intl.NumberFormat('en-IN', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  var $ = function (s, r) { return (r || document).querySelector(s); };
  var KEY = 'datre-mis-calc-v1';

  /* ---------- input definition: factory PL feed, HO items, adjustments, statistics ---------- */
  var SECTIONS = [
    { id: 'sales', title: 'Sales and returns', hint: 'Rs. lakh. From the factory PL rows 7 to 10.', fields: [
      { k: 'sale_a', l: 'Actual despatch made (sale ex GST)', n: 'PL row 8a' },
      { k: 'sale_b', l: 'Ready to despatch adjustment', neg: 1, n: 'PL row 8b. Can be negative.' },
      { k: 'sret', l: 'Sales return for the month', n: 'PL row 10' },
      { k: 'rst_op', l: 'Returned goods stock, opening', auto: 'rst_cl', n: 'Fills from last month closing if left blank' },
      { k: 'rst_cl', l: 'Returned goods stock, closing', n: 'PL row 7. Change in stock is closing less opening' },
      { k: 'pat', l: 'Pattern income', n: 'Shown as other business income' },
      { k: 'stor', l: 'Storage facility service charges', n: 'Shown as storage facility income' } ] },
    { id: 'mat', title: 'Materials and stock', hint: 'Rs. lakh. PL rows 1 and 6.', fields: [
      { k: 'basic', l: 'Basic raw material' }, { k: 'cons', l: 'Consumables' }, { k: 'addl', l: 'Additional expense on purchase' },
      { k: 'wip_op', l: 'Work in progress, opening', auto: 'wip_cl', n: 'Fills from last month closing if left blank' },
      { k: 'wip_cl', l: 'Work in progress, closing', n: 'PL row 6' } ] },
    { id: 'job', title: 'Job work', hint: 'Rs. lakh. PL row 2.', fields: [
      { k: 'j1', l: 'Krishna Enterprise, MLT MLD etc' }, { k: 'jqc', l: 'Rahaman Enterprise QC' }, { k: 'j2', l: 'Krishna / Rahaman, FLT' },
      { k: 'j3', l: 'Sree Engineering' }, { k: 'j4', l: 'Tapas Samanta and outside-inside machining' }, { k: 'j5', l: 'Outside heat treatment' }, { k: 'jrad', l: 'Radiography charges' } ] },
    { id: 'pow', title: 'Power', hint: 'Rs. lakh. PL row 3.', fields: [
      { k: 'dem', l: 'Demand charges', n: 'Goes to fixed power cost' }, { k: 'powx', l: 'Power cost excluding demand charge', n: 'Goes to variable power cost' }, { k: 'dg', l: 'DG fuel' } ] },
    { id: 'oth', title: 'Repairs and other factory expenses', hint: 'Rs. lakh. PL rows 4 and 5.', fields: [
      { k: 'repair', l: 'Consumption for plant and machinery maintenance' },
      { k: 'o1', l: 'Machinery maintenance, service' }, { k: 'o2', l: 'Maintenance, building' }, { k: 'o3', l: 'Security expense' }, { k: 'o4', l: 'Manufacturing overhead' },
      { k: 'o5', l: 'Selling and distribution expense' }, { k: 'o6', l: 'Business promotion' }, { k: 'o7', l: 'Transport against sale' },
      { k: 'o8', l: 'Transport on sale return' }, { k: 'o9', l: 'Liquidity damages' } ] },
    { id: 'ho', title: 'HO ledger items', hint: 'Rs. lakh. Not in the factory feed.', fields: [
      { k: 'admin', l: 'Administrative expenses' }, { k: 'sal', l: 'Salary and wages' }, { k: 'defr', l: 'Deferred revenue expenses' },
      { k: 'nonop', l: 'Other non-operating expenses' }, { k: 'dep', l: 'Depreciation' }, { k: 'int', l: 'Interest' },
      { k: 'gst', l: 'GST rate on domestic sales (%)', n: 'Leave blank for 18%', pctf: 1 } ] },
    { id: 'adj', title: 'HO adjustments', hint: 'Rs. lakh. Plus increases the cost or income shown. Note the reason for each.', fields: [
      { k: 'amat', l: 'Material consumed adjustment', neg: 1 }, { k: 'astk', l: '(Increase)/decrease in stock adjustment', neg: 1 },
      { k: 'apow', l: 'Variable power adjustment', neg: 1 }, { k: 'ajob', l: 'Job-work adjustment', neg: 1, n: 'For example QC job work not in the factory feed' },
      { k: 'carve', l: 'Selling expenses carved out of other factory expenses', n: 'Moves cost from other overhead to selling expenses. No PBT effect' },
      { k: 'patre', l: 'Pattern income shown under storage income', n: 'Moves income between the two lines. No PBT effect' } ] },
    { id: 'stat', title: 'Statistics', hint: 'MT for tonnage, Rs. lakh for collections.', fields: [
      { k: 'prod', l: 'Production (MT)' }, { k: 'desp', l: 'Despatch (MT)' }, { k: 'rej', l: 'In-house rejections (MT)' }, { k: 'coll', l: 'Collections including GST (Rs. lakh)' } ] }
  ];
  var ALLKEYS = []; SECTIONS.forEach(function (s) { s.fields.forEach(function (f) { ALLKEYS.push(f.k); }); });

  /* ---------- state ---------- */
  var state = { fy: '2026-27', month: 1, tab: 'in', theme: '', data: {}, ytd: false };
  try { var sv = JSON.parse(localStorage.getItem(KEY) || 'null'); if (sv) for (var k in state) if (sv[k] !== undefined) state[k] = sv[k]; } catch (e) {}
  function save() { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {} }
  function applyTheme() { if (state.theme) document.documentElement.setAttribute('data-theme', state.theme); else document.documentElement.removeAttribute('data-theme'); }
  applyTheme();
  function fyData() { return state.data[state.fy] || (state.data[state.fy] = {}); }
  function md(m) { return fyData()[m] || (fyData()[m] = {}); }
  function has(v) { return v !== undefined && v !== null && String(v).trim() !== '' && !isNaN(parseFloat(v)); }
  function num(v) { return has(v) ? parseFloat(v) : 0; }
  function r2(v) { return Math.round(v * 100) / 100; }
  function hasData(d) { return ALLKEYS.some(function (k) { return has(d[k]); }); }

  /* ---------- the MIS formulas (same as the Excel template) ---------- */
  function calc(m) {
    var d = md(m), prev = (state.data[state.fy] || {})[m - 1] || {};
    var g = function (k) { return num(d[k]); };
    var gst = has(d.gst) ? num(d.gst) : 18;
    var L = {};
    L.sex = g('sale_a') + g('sale_b');
    L.gst = r2(L.sex * gst / 100);
    L.sinc = L.sex + L.gst;
    L.ret = g('sret');
    L.net = L.sex - L.ret;
    L.oinc = g('pat') - g('patre');
    var rop = has(d.rst_op) ? num(d.rst_op) : has(prev.rst_cl) ? num(prev.rst_cl) : 0;
    L.srg = has(d.rst_cl) ? num(d.rst_cl) - rop : 0;
    L.sub = L.net + L.oinc + L.srg;
    L.matpl = g('basic') + g('cons') + g('addl');
    L.mat = L.matpl + g('amat');
    var wop = has(d.wip_op) ? num(d.wip_op) : has(prev.wip_cl) ? num(prev.wip_cl) : 0;
    L.wipchg = has(d.wip_cl) ? num(d.wip_cl) - wop : 0;
    L.stk = -L.wipchg + g('astk');
    L.powv = g('powx') + g('dg') + g('apow');
    L.job = g('j1') + g('jqc') + g('j2') + g('j3') + g('j4') + g('j5') + g('jrad') + g('ajob');
    L.nvc = L.mat + L.stk + L.powv + L.job;
    L.contr = L.sub - L.nvc;
    L.adm = g('admin');
    L.rep = g('repair');
    L.othtot = g('o1') + g('o2') + g('o3') + g('o4') + g('o5') + g('o6') + g('o7') + g('o8') + g('o9');
    L.omo = L.othtot - g('carve');
    L.sal = g('sal');
    L.powf = g('dem');
    L.sell = g('carve');
    L.tfc = L.adm + L.rep + L.omo + L.sal + L.powf + L.sell;
    L.npo = L.contr - L.tfc;
    L.pad = L.npo - g('defr') - g('nonop');
    L.stor = g('stor') + g('patre');
    L.ebitda = L.pad + L.stor;
    L.pbt = L.ebitda - g('dep') - g('int');
    L.prod = g('prod'); L.desp = g('desp'); L.rej = g('rej'); L.coll = g('coll');
    L.real = g('desp') ? g('sale_a') / g('desp') : 0;
    return L;
  }
  var LINES = [
    ['sec', 'Turnover'], ['sinc', 'Sales domestic (incl GST)'], ['gst', 'Less GST'], ['sex', 'Sales domestic (ex GST)'], ['ret', 'Less: sales return'], ['net', 'Net sales', 1],
    ['oinc', 'Other business income'], ['srg', 'Stock of return goods'], ['sub', 'Net turnover for contribution', 1],
    ['sec', 'Variable costs'], ['mat', 'Material consumed'], ['stk', '(Increase)/decrease in stock'], ['powv', 'Power and fuel (variable)'], ['job', 'Job-work charges'], ['nvc', 'Total net variable costs', 1],
    ['contr', 'Contribution', 1],
    ['sec', 'Fixed costs'], ['adm', 'Administrative expenses'], ['rep', 'Repair and maintenance'], ['omo', 'Other manufacturing overhead'], ['sal', 'Salary and wages'], ['powf', 'Power and fuel (fixed)'], ['sell', 'Selling expenses'], ['tfc', 'Total fixed costs', 1],
    ['npo', 'Net profit from operations', 1], ['stor', 'Storage facility income'], ['ebitda', 'EBITDA', 1], ['pbt', 'PBT', 1]
  ];
  var SUMKEYS = LINES.filter(function (l) { return l[0] !== 'sec'; }).map(function (l) { return l[0]; }).concat(['prod', 'desp', 'rej', 'coll', 'wipchg']);
  function lastMonth() { return state.month; }
  function ytd(upto) {
    var T = {}; SUMKEYS.forEach(function (k) { T[k] = 0; }); var n = 0;
    for (var m = 1; m <= upto; m++) { var d = (state.data[state.fy] || {})[m]; if (d && hasData(d)) { var L = calc(m); SUMKEYS.forEach(function (k) { T[k] += L[k]; }); n++; } }
    T._n = n; return T;
  }
  function fmt(v) { return nf.format(Math.abs(v) < 0.005 ? 0 : v); }
  function h(tag, cls, text) { var e = document.createElement(tag); if (cls) e.className = cls; if (text !== undefined) e.textContent = text; return e; }
  function toast(msg) { var t = h('div', 'toast', msg); document.body.appendChild(t); setTimeout(function () { t.remove(); }, 2200); }

  /* ---------- Enter view ---------- */
  var inputs = {};
  function buildInputs() {
    var v = $('#v-in'); v.replaceChildren(); inputs = {};
    SECTIONS.forEach(function (s, si) {
      var det = h('details', 'card'); if (si === 0) det.open = true;
      var sum = h('summary'); var left = h('div'); left.appendChild(h('h2', '', s.title)); left.appendChild(h('div', 'sub', s.hint)); sum.appendChild(left);
      var badge = h('span', 'badge'); badge.id = 'bd-' + s.id; sum.appendChild(badge);
      sum.insertAdjacentHTML('beforeend', '<svg class="chev" viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg>');
      det.appendChild(sum);
      var box = h('div', 'fields');
      s.fields.forEach(function (f) {
        var row = h('div', 'f'); var lab = h('label', 'l', f.l); var id = 'in-' + f.k; lab.htmlFor = id; row.appendChild(lab);
        var wrap = h('div', 'in');
        var inp = document.createElement('input'); inp.id = id; inp.type = 'text'; inp.inputMode = 'decimal'; inp.autocomplete = 'off'; inp.setAttribute('enterkeyhint', 'next'); inp.placeholder = '0.00';
        inp.addEventListener('input', function () {
          var val = inp.value.replace(/,/g, '').replace(/[^0-9.\-]/g, ''); if (val !== inp.value) inp.value = val;
          md(state.month)[f.k] = val; save(); refresh();
        });
        inp.addEventListener('keydown', function (e) { if (e.key === 'Enter') { e.preventDefault(); var all = Array.prototype.slice.call(document.querySelectorAll('#v-in input')); var i = all.indexOf(inp); if (all[i + 1]) { var nx = all[i + 1]; var d = nx.closest('details'); if (d) d.open = true; nx.focus(); } else inp.blur(); } });
        wrap.appendChild(inp);
        if (f.neg) { var sg = h('button', 'sign', '±'); sg.type = 'button'; sg.setAttribute('aria-label', 'Change sign of ' + f.l); sg.addEventListener('click', function () { var c = inp.value.trim(); if (!c) { inp.value = '-'; inp.focus(); } else inp.value = c.charAt(0) === '-' ? c.slice(1) : '-' + c; md(state.month)[f.k] = inp.value; save(); refresh(); }); wrap.appendChild(sg); }
        row.appendChild(wrap);
        if (f.n) row.appendChild(h('div', 'n', f.n));
